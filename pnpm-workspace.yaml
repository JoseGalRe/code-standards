allowBuilds:
  lefthook: true
  oxlint: true

autoInstallPeers: true

blockExoticSubdeps: true

catalog:
  '@types/node': 24.19.1
  eslint: 10.15.0
  typescript: 6.0.3
  vite-plus: 1.7.0

dedupePeers: true

engineStrict: true

# Set a minimum release age (in minutes) for packages to be considesred for installation.
# This helps avoid installing packages that were just published and may not be fully propagated yet.
# And also helps to reduce the chain attack target in npm registry.
minimumReleaseAge: 1440

packages:
  - packages/*

saveExact: true

savePrefix: ''

shellEmulator: true

strictPeerDependencies: true

trustLockfile: true

updateConfig:
  ignoreDependencies:
    - '@types/node'
    - node
    - typescript

verifyDepsBeforeRun: false
